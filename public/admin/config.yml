backend:
  name: github
  repo: VOTRE-USER/VOTRE-REPO # ex. philouuone/site-influenceur-amazon
  branch: main
  base_url: https://sveltia-cms-auth.VOTRE-SOUS-DOMAINE.workers.dev
  auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Réglages du site"
    files:
      - file: "src/data/site.json"
        label: "Infos créateur"
        name: "site"
        fields:
          - { label: "Nom / Pseudo", name: "name", widget: "string" }
          - { label: "Handle réseaux (ex. @pseudo)", name: "handle", widget: "string" }
          - { label: "Phrase d'accroche", name: "tagline", widget: "string" }
          - {
              label: "Description SEO (aperçu Google / réseaux)",
              name: "metaDescription",
              widget: "text",
              hint: "Résume le thème de la vitrine en 1-2 phrases. Utile si vous changez de thème plus tard (pêche, beauté, high-tech...) sans toucher au code.",
            }
          - { label: "Avatar", name: "avatar", widget: "image" }
          - { label: "Tag Amazon (ex. moncompte-21)", name: "amazonTag", widget: "string" }
          - {
              label: "Afficher les prix sur le site",
              name: "showPrices",
              widget: "boolean",
              default: false,
              hint: "⚠️ Laissez désactivé tant que vous n'avez pas accès à la Creators API / Product Advertising API d'Amazon (accès obtenu après 3 ventes qualifiées, voir guide de déploiement étape 0). Sans cet accès, afficher un prix saisi à la main est interdit par l'Operating Agreement Amazon Partenaires — les prix changent en permanence et doivent venir d'un appel en temps réel, jamais d'une valeur fixe. Tant que c'est désactivé, les cartes produits affichent « Voir le prix → » sans montrer de chiffre.",
            }
          - label: "Réseaux sociaux"
            name: "socials"
            widget: "list"
            fields:
              - { label: "Plateforme", name: "platform", widget: "select", options: ["Instagram", "TikTok", "YouTube"] }
              - { label: "URL", name: "url", widget: "string" }

  - name: "lists"
    label: "Listes d'idées"
    folder: "src/content/lists"
    create: true
    slug: "{{slug}}"
    extension: "yaml"
    format: "yaml"
    fields:
      - { label: "Titre de la liste (affiché en en-tête)", name: "title", widget: "string" }
      - {
          label: "Libellé court (affiché dans l'onglet, ex. « Routine du soir »)",
          name: "tabLabel",
          widget: "string",
          required: false,
          hint: "Laissez vide pour réutiliser le titre complet — mais un libellé de 1 à 3 mots évite que l'onglet déborde sur mobile.",
        }
      - { label: "Icône (emoji)", name: "icon", widget: "string", required: false }
      - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int", default: 1 }
      - label: "Produits"
        name: "products"
        widget: "list"
        required: false
        summary: "{{title}} — {{price}} €"
        hint: "Cas simple : produits directement listés ici. Si vous utilisez « Sous-idées » ci-dessous à la place, laissez ce champ vide."
        fields: &productFields
          - { label: "Titre produit", name: "title", widget: "string" }
          - { label: "Prix indicatif (€)", name: "price", widget: "number", value_type: "float" }
          - {
              label: "Prix de référence avant réduction (€, optionnel)",
              name: "originalPrice",
              widget: "number",
              value_type: "float",
              required: false,
              hint: "⚠️ Laissez vide si aucune vraie réduction en cours. Si rempli, ce prix doit être un prix réellement pratiqué sur ce produit dans les 30 derniers jours (réglementation française sur les annonces de réduction de prix) — à mettre à jour régulièrement, jamais laissé au hasard.",
            }
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Lien affilié (amzn.to ou amazon.fr)", name: "affiliateUrl", widget: "string" }
          - {
              label: "Produit d'appel (< 20 €, à placer en tête de liste)",
              name: "isStarterProduct",
              widget: "boolean",
              default: false,
              required: false,
            }
      - label: "Sous-idées (optionnel)"
        name: "subIdeas"
        widget: "list"
        required: false
        summary: "{{title}}"
        hint: "Cas avancé : regroupe les produits par sous-thème à l'intérieur de cette liste (ex. « Leurres souples », « Leurres durs », « Rangement »). Si vous remplissez ceci, le champ « Produits » ci-dessus est ignoré."
        fields:
          - { label: "Titre de la sous-idée", name: "title", widget: "string" }
          - label: "Produits"
            name: "products"
            widget: "list"
            summary: "{{title}} — {{price}} €"
            fields: *productFields

  - name: "photos"
    label: "Shoppable Photos"
    folder: "src/content/photos"
    create: true
    slug: "{{slug}}"
    extension: "yaml"
    format: "yaml"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Largeur réelle (px)", name: "imageWidth", widget: "number", value_type: "int" }
      - { label: "Hauteur réelle (px)", name: "imageHeight", widget: "number", value_type: "int" }
      - label: "Pastilles cliquables"
        name: "hotspots"
        widget: "list"
        summary: "{{title}}"
        fields:
          - { label: "Position horizontale (% depuis la gauche)", name: "x", widget: "number", value_type: "float" }
          - { label: "Position verticale (% depuis le haut)", name: "y", widget: "number", value_type: "float" }
          - { label: "Titre produit", name: "title", widget: "string" }
          - { label: "Prix indicatif (€)", name: "price", widget: "number", value_type: "float" }
          - { label: "Lien affilié", name: "affiliateUrl", widget: "string" }
